<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vista previa logo - ProGanado</title>
<style>
  body { margin:0; font-family: 'DM Sans', Arial, sans-serif; background:#0e2118; color:white; }
  .wrap {
    min-height:100vh; display:flex; align-items:center; justify-content:center; gap:24px; flex-wrap:wrap;
    padding:32px 20px;
    background: url('assets/login-banner.jpg') center 35% / cover no-repeat, linear-gradient(160deg,#173d2e,#10281c);
    position:relative;
  }
  .wrap::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,24,16,.60), rgba(8,24,16,.30) 45%, rgba(6,18,12,.78)); }
  .card { position:relative; z-index:1; width:min(420px,100%); background:linear-gradient(160deg, rgba(255,255,255,.17), rgba(255,255,255,.07));
    border:1px solid rgba(255,255,255,.38); border-radius:24px; backdrop-filter:blur(22px); padding:30px 28px; text-align:center; }
  .card h3 { margin:0 0 4px; font-size:15px; letter-spacing:.5px; text-transform:uppercase; opacity:.9; }
  .card p.sub { margin:0 0 18px; font-size:12.5px; opacity:.8; }
  .card img { width:300px; max-width:100%; display:block; margin:0 auto; }
  /* ANTES: como estaba */
  .antes img { padding:0; background:none; border:0; border-radius:0; box-shadow:none;
    filter: drop-shadow(0 6px 22px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(180,240,205,.35)); }
  /* DESPUÉS: nuevo con negro transparente */
  .despues img {
    padding:16px 30px;
    background:linear-gradient(165deg, rgba(5,12,8,.62), rgba(5,12,8,.38));
    border:1px solid rgba(255,255,255,.22); border-radius:18px;
    box-shadow:0 10px 32px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    filter:drop-shadow(0 6px 22px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(180,240,205,.35));
  }
  .tag { display:inline-block; margin-top:16px; font-size:11px; font-weight:700; padding:6px 12px; border-radius:20px; }
  .tag.antes-t { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); }
  .tag.despues-t { background:#27915f; border:1px solid rgba(255,255,255,.25); }
  .nota { position:relative; z-index:1; width:100%; text-align:center; font-size:12px; opacity:.85; }
  a.btn { position:relative; z-index:1; color:#fff; background:#27915f; padding:10px 18px; border-radius:10px; text-decoration:none; font-weight:700; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card antes">
    <h3>Antes</h3>
    <p class="sub">Logo flotando sin fondo</p>
    <img src="assets/proganado-logo-blanco.png" alt="Antes" />
    <br><span class="tag antes-t">Sin pastilla negra</span>
  </div>
  <div class="card despues">
    <h3>Después ✔</h3>
    <p class="sub">Con negro transparente</p>
    <img src="assets/proganado-logo-blanco.png" alt="Después" />
    <br><span class="tag despues-t">Nuevo estilo aplicado</span>
  </div>
  <p class="nota">Si el de la derecha se ve con más contraste pero aún deja ver el fondo, el cambio quedó bien.</p>
  <p style="width:100%; text-align:center; position:relative; z-index:1;"><a class="btn" href="index.html">Ver login real →</a></p>
</div>
</body>
</html>
